spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/hrms_notifications?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8086
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

twilio:
  account-sid: ${SMS_ACCOUNT_SID}
  auth-token: ${SMS_AUTH_TOKEN}
  phone-number: ${SMS_PHONE_NUMBER}

whatsapp:
  business-account-id: ${WA_BUSINESS_ACCOUNT_ID}
  phone-number: ${WA_BUSINESS_PHONE_NUMBER}
  api-token: ${WA_API_TOKEN}
