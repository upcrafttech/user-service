---
# Notification Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: upcraft/notification-service:latest
        ports:
        - containerPort: 8086
        env:
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: hrms-config
              key: spring.rabbitmq.host
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: hrms-secrets
              key: mail.username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hrms-secrets
              key: mail.password
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: hrms
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - port: 80
    targetPort: 8086
