apiVersion: v1
kind: Namespace
metadata:
  name: hrms
  labels:
    name: hrms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-config
  namespace: hrms
data:
  spring.datasource.url: "jdbc:mysql://mysql:3306/hrms_users?useSSL=false&serverTimezone=UTC"
  spring.datasource.username: "root"
  keycloak.server-url: "http://keycloak:8080"
  keycloak.realm: "hrms"
  keycloak.client-id: "hrms-app"
  spring.rabbitmq.host: "rabbitmq"
  spring.rabbitmq.port: "5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms
type: Opaque
stringData:
  spring.datasource.password: "root"
  keycloak.client-secret: "client-secret-change-me"
  keycloak.admin-username: "admin"
  keycloak.admin-password: "admin"
  mail.username: "your-email@gmail.com"
  mail.password: "app-password-change-me"
  sms.account-sid: "twilio-account-sid"
  sms.auth-token: "twilio-auth-token"
  whatsapp.api-token: "whatsapp-api-token"
